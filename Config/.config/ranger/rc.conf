set preview_images true
set preview_images_method kitty
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh

set colorscheme default

map 1 tabn 1
map 2 tabn 2
map 3 tabn 3
map 4 tabn 4
map 5 tabn 5
map 6 tabn 6
map 7 tabn 7
map 8 tabn 8
map 9 tabn 9

set show_hidden true
map dT trash
map dR trashrestore
map dX trashrm
map Cf console touch%space  
map Cd console mkdir%space   

map e fzf_e
map E fzf_E
map ws wormhole_send
map ww console mkfile%space
map r fzf_open_with
map zip console zip%space
map unzip unzip
default_linemode devicons2

# --- ranger_zed integration ---
# Choosing = navigate to a FILE and press Enter (or l / Right).
# With --choosefile (used by ranger_zed), opening a file makes ranger exit
# and write its path out, and the wrapper opens it in Zed as a tab.
# These mirror ranger's defaults; stated explicitly so a minimal rc.conf
# never silently loses the "Enter opens file" behavior.
map <CR> move right=1
map l move right=1
map <RIGHT> move right=1
map h move left=1
map <LEFT> move left=1

[urgency_low]
    background = "#211f2480"
    foreground = "#cac4cfE6"
    frame_color = "#48454e03"
    icon = "$HOME/.config/dunst/icons/hyprdots.svg"
    timeout = 5

[urgency_normal]
    background = "#2b292f80"
    foreground = "#e6e1e9E6"
    frame_color = "#cebdff03"
    icon = "$HOME/.config/dunst/icons/hyprdots.svg"
    timeout = 5

[urgency_critical]
    background = "#93000aFF"
    foreground = "#ffdad6FF"
    frame_color = "#ffb4abFF"
    icon = "$HOME/.config/dunst/icons/critical.svg"
    timeout = 0

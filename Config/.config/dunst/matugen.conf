[urgency_low]
    background = "#201f2580"
    foreground = "#c8c5d0E6"
    frame_color = "#47464f03"
    icon = "$HOME/.config/dunst/icons/hyprdots.svg"
    timeout = 5

[urgency_normal]
    background = "#2a292f80"
    foreground = "#e5e1e9E6"
    frame_color = "#c3c0ff03"
    icon = "$HOME/.config/dunst/icons/hyprdots.svg"
    timeout = 5

[urgency_critical]
    background = "#93000aFF"
    foreground = "#ffdad6FF"
    frame_color = "#ffb4abFF"
    icon = "$HOME/.config/dunst/icons/critical.svg"
    timeout = 0

# yazi.toml
[mgr]
show_hidden = true
ratio = [2,3,4]
sort_reverse = true
mouse_events = ["click", "scroll", "touch", "move", "drag"]

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, for = "linux" },
]
play = [
	{ run = 'mpv "$@"', block = true, for = "linux" },
]
nsxiv = [
	{ run = 'nsxiv "$@"', block = true, for = "linux" },
]

[open]
prepend_rules = [
	{ mime = "image/*", use = "nsxiv" },
]